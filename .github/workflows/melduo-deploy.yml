name: Deploy Portfolio to AWS (S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      bootstrap_repair:
        description: "Repair a stuck CDK bootstrap stack before deploying"
        required: false
        default: "false"
  push:
    branches: [ "melduo/deploy-cmr30jvk" ]

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: PortfolioStack

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Bun setup (app package manager) ───────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # ── 3. Node 22 setup (required for CDK CLI) ───────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 4. Configure AWS credentials via OIDC ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.MELDUO_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 5. Install app dependencies ──────────────────────────────────────────
      - name: Install app dependencies
        run: bun install

      # ── 6. Build Next.js static export ───────────────────────────────────────
      - name: Build Next.js static site
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # ── 7. Install CDK dependencies ───────────────────────────────────────────
      - name: Install CDK dependencies
        working-directory: infra
        run: npm install

      # ── 8. CDK Bootstrap (self-healing) ──────────────────────────────────────
      - name: CDK Bootstrap (self-healing)
        working-directory: infra
        env:
          BOOTSTRAP_REPAIR: ${{ github.event.inputs.bootstrap_repair }}
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name CDKToolkit --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
          if [ "$BOOTSTRAP_REPAIR" = "true" ] && echo "$STATUS" | grep -qE "DELETE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED|CREATE_FAILED"; then
            echo "Repairing stuck CDKToolkit ($STATUS)…"
            RETAIN=$(aws cloudformation describe-stack-events --stack-name CDKToolkit --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].LogicalResourceId" --output text | tr '\t' ' ')
            if [ -n "$RETAIN" ]; then
              aws cloudformation delete-stack --stack-name CDKToolkit --retain-resources $RETAIN
            else
              aws cloudformation delete-stack --stack-name CDKToolkit
            fi
            aws cloudformation wait stack-delete-complete --stack-name CDKToolkit || true
          fi
          npx cdk bootstrap

      # ── 9. CDK Deploy (stack: S3 + CloudFront) ───────────────────────────────
      - name: CDK Deploy
        working-directory: infra
        run: npx cdk deploy ${{ env.STACK_NAME }} --require-approval never --outputs-file cdk-outputs.json

      # ── 10. Extract stack outputs ─────────────────────────────────────────────
      - name: Extract stack outputs
        working-directory: infra
        id: outputs
        run: |
          BUCKET=$(jq -r '.[${{ toJSON(env.STACK_NAME) }}].BucketName' cdk-outputs.json)
          DIST_ID=$(jq -r '.[${{ toJSON(env.STACK_NAME) }}].DistributionId' cdk-outputs.json)
          CF_DOMAIN=$(jq -r '.[${{ toJSON(env.STACK_NAME) }}].CloudFrontDomain' cdk-outputs.json)
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT
          echo "cf_domain=$CF_DOMAIN" >> $GITHUB_OUTPUT
          echo "✅ Bucket: $BUCKET"
          echo "✅ Distribution: $DIST_ID"
          echo "✅ URL: $CF_DOMAIN"

      # ── 11. Sync static assets to S3 ─────────────────────────────────────────
      - name: Sync static assets to S3
        run: |
          aws s3 sync out/ s3://${{ steps.outputs.outputs.bucket }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          # HTML and JSON files get shorter cache TTL
          aws s3 sync out/ s3://${{ steps.outputs.outputs.bucket }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json"

      # ── 12. Invalidate CloudFront cache ───────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.dist_id }} \
            --paths "/*"
          echo "🌐 Portfolio live at: ${{ steps.outputs.outputs.cf_domain }}"
